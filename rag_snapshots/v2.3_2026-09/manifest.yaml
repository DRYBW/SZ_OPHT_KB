version: v2.3_2026-09
created: '2026-09-25'
description: >
  v2.3 fully inherits v2.2 and adds the four cornea kbadd reference papers of the fixed list
  (EyeKB-RAG supplement card t_f3fa8c95 targeted lane, upstream = KB-supplement card t_e1febb8e
  sidecar kbadd_KERATOCYTE_20260924.jsonl, the 4 entries marked PENDING_MAIN_DB, verified via
  eutils bibliographic check). The regular main-journal lane still requires OA (isOpenAccess=Y
  with a PMCID), IF>3 (OpenAlex 2yr_mean_citedness, same source across the library) and tissue
  verification; this version additionally defines a targeted lane (admission_lane=kbadd_keratocyte_targeted),
  registering per-paper the exceptions to regular conditions and their rationale (data_kc/kc_admission.json).
  OA status of PMID 11328728 and 15914606 is N (neither has a PMCID → abstract-only).
  Full-text acquisition status and actual inclusion scope are registered separately: abstract-only
  entries (fulltext_status=abstract_only, chunk-level full_text_available=0) provide only evidence
  verifiable from the abstract, which does not mean the body text was obtained or verified.
  These entries are published main-journal papers, is_preprint=0; the v2.1 preprint lane and the
  default preprint-excluding retrieval semantics remain unchanged. This targeted lane is not
  generalized into an entrance for non-OA main-journal papers.
