description: >
  v2.3 全量继承 v2.2，并新增固定清单中的四篇角膜 kbadd 引用文献
  (EyeKB-RAG 增补卡 t_f3fa8c95 定向通道, 上游=KB 补录卡 t_e1febb8e sidecar
  kbadd_KERATOCYTE_20260924.jsonl 中标注 PENDING_MAIN_DB 的 4 篇, 已 eutils 题录核验)。
  常规正刊通道仍要求 OA (isOpenAccess=Y 且有 PMCID)、IF>3 (OpenAlex 2yr_mean_citedness,
  全库同源口径) 及组织核验；本版另设定向通道 (admission_lane=kbadd_keratocyte_targeted)，
  逐篇登记不满足常规条件的例外及其理由 (data_kc/kc_admission.json)。
  PMID 11328728、15914606 的 OA 状态为 N (均无 PMCID → abstract-only)。
  全文获取状态与实际收录范围分别登记: abstract-only 条目 (fulltext_status=abstract_only,
  chunk 级 full_text_available=0) 仅提供摘要中可核验的证据，不代表已取得或核验正文。
  这些条目为已发表正刊, is_preprint=0; v2.1 预印本通道及默认排除预印本的检索语义保持不变。
  本定向通道不泛化为所有非 OA 正刊的入口。
